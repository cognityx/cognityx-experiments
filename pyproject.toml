[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognityx-experiments"
version = "0.1.0"
description = "Deterministic research specifications and experiment execution for Cognityx"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Cognityx" }]
dependencies = [
    "cognityx-observability @ git+https://github.com/cognityx/cognityx-observability.git@b02ec3c103d0b3fd22b7c33888155b763d6baa9f",
    "cognityx-resource @ git+https://github.com/cognityx/cognityx-resource.git@a740b0d54681236ac0699277a82e502ed385c954",
    "cognityx-storage @ git+https://github.com/cognityx/cognityx-storage.git@9e51398e89d5df952e37b766b62f31bb2519b5ff",
    "pyyaml>=6.0",
]

[project.scripts]
cognityx-experiments = "cognityx_experiments.cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.5",
    "mypy>=1.17",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognityx_experiments"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/cognityx_experiments"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
